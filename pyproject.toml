[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "botcapturar"
version = "0.2.0"
description = "Local Kick chat automation for the $capturar command"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "keyring>=25,<26",
]

[project.gui-scripts]
botcapturar = "botcapturar.__main__:main"

[project.optional-dependencies]
build = [
    "pyinstaller>=6,<7",
]
test = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
